{% extends 'tarefas/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-dark shadow-sm mt-5">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Confirmar Exclusão</h5>
            </div>
            <div class="card-body p-4 text-center">
                <h4 class="mb-4">Tem certeza que deseja excluir esta tarefa?</h4>
                <div class="alert alert-secondary mb-4">
                    <strong>{{ tarefa.titulo }}</strong><br>
                    Esta ação não poderá ser desfeita.
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'detalhe_tarefa' tarefa.pk %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-dark px-4">Sim, excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
